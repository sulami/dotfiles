[user]
name = "Robin Schroer"
email = "git@sulami.xyz"

[signing]
behavior = "own"
backend = "ssh"
key = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMkTnMlqXJyhMLJyP4n3DkJo5imNbTTy0ZwYBac32jsz git@sulami.xyz"

[ui]
default-command = "status"
# diff-formatter = ":git"
diff-formatter = [ "difft", "--color=always", "$left", "$right" ]
pager = [ "delta", "--light", "--side-by-side", "--pager", "less -FRX" ]

[remotes.origin]
auto-track-bookmarks = "glob:*"

[aliases]
de = [ "describe" ]
di = [ "diff" ]
dis = [ "diff", "--stat" ]
fresh = [ "new", "trunk()" ]
g = [ "git" ]
gf = [ "git", "fetch" ]
gp = [ "git", "push" ]
l = [ "log" ]
lf = [ "log", "-r", "::@" ]
ll = [ "log", "-r", "all()" ]
sh = [ "show" ]
tug = [ "bookmark", "move", "--from", "heads(::@ & bookmarks())" ]

[templates]
git_push_bookmark = '"sulami/push-" ++ change_id.short()'
draft_commit_description = '''
concat(
  coalesce(description, default_commit_description, "\n"),
  surround(
    "\nJJ: This commit contains the following changes:\n", "",
    indent("JJ:     ", diff.stat(72)),
  ),
  "\nJJ: ignore-rest\n",
  diff.git(),
)
'''
